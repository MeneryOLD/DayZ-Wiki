<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(#{title.modPosts})}"></head>
<body>
<div class="app">
    <aside th:replace="~{layout :: sidebar('moderation')}"></aside>
    <div class="main">
        <header th:replace="~{layout :: topbar}"></header>

        <main class="content" id="modPostsPage">
            <div class="page-head">
                <div>
                    <div class="eyebrow"><i class="fa-solid fa-shield-halved"></i> <th:block th:text="#{mod.eyebrow}">Moderation</th:block></div>
                    <h1 class="page-title" th:text="#{mod.postsTitle}">Review queue</h1>
                    <p class="page-sub" id="queueLead" th:attr="data-zero=#{mod.queueEmptyLead}"
                       th:text="${posts.isEmpty()} ? #{mod.queueEmptyLead} : #{mod.queueLead(${posts.size()})}">3 posts are waiting. Oldest first.</p>
                </div>
            </div>
            <nav th:replace="~{post/parts :: modtabs('posts')}"></nav>

            <div class="queue" id="queue">
                <article th:each="c : ${posts}" class="queue-item" th:attr="data-post-id=${c.post.id}">
                    <div class="queue-main">
                        <div class="queue-meta">
                            <a class="post-author" th:href="@{'/@' + ${c.post.author.name}}">
                                <img class="avatar avatar-sm" th:src="@{/profile/get-avatar(user_id=${c.post.author.id})}" alt="">
                                <b th:text="${c.post.author.name}">author</b>
                            </a>
                            <time th:if="${c.post.createdAt != null}" th:attr="datetime=${c.post.createdAt}" th:text="${#temporals.format(c.post.createdAt, 'd MMM yyyy, HH:mm')}">date</time>
                        </div>
                        <h2><a th:href="@{/posts/{id}(id=${c.post.id})}" th:text="${c.post.title}">Title</a></h2>
                        <p class="queue-text" th:text="${c.post.content}">Text</p>
                        <button class="link-btn queue-more" hidden th:text="#{mod.showMore}">Show more</button>
                        <div class="queue-shots" th:if="${!imageIds[c.post.id].isEmpty()}">
                            <a th:each="imgId : ${imageIds[c.post.id]}" th:href="@{/posts/images/{id}(id=${imgId})}" target="_blank" rel="noopener">
                                <img th:src="@{/posts/images/{id}(id=${imgId})}" alt="" loading="lazy">
                            </a>
                        </div>
                    </div>
                    <div class="queue-actions">
                        <button class="btn btn-good" data-moderate="approve"><i class="fa-solid fa-check"></i> <th:block th:text="#{mod.approve}">Approve</th:block></button>
                        <button class="btn btn-danger-ghost" data-moderate="reject"><i class="fa-solid fa-xmark"></i> <th:block th:text="#{mod.reject}">Reject</th:block></button>
                        <a class="btn btn-ghost" th:href="@{/posts/{id}(id=${c.post.id})}"><i class="fa-solid fa-up-right-from-square"></i> <th:block th:text="#{mod.open}">Open</th:block></a>
                    </div>
                </article>
            </div>

            <div class="empty empty-big" id="queueEmpty" th:attr="hidden=${!posts.isEmpty()} ? 'hidden' : null">
                <span class="empty-icon good"><i class="fa-solid fa-check-double"></i></span>
                <h2 th:text="#{mod.clearTitle}">Queue is clear</h2>
                <p th:text="#{mod.clearText}">Nothing is waiting for review. New posts will show up here.</p>
                <a class="btn" href="/posts"><i class="fa-solid fa-newspaper"></i> <th:block th:text="#{mod.toPosts}">Go to posts</th:block></a>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{post/parts :: confirm}"></div>
<th:block th:replace="~{layout :: overlays}"></th:block>
<th:block th:replace="~{layout :: scripts}"></th:block>
<script th:src="@{/js/community.js}" src="/js/community.js"></script>
</body>
</html>
