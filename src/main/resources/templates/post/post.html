<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${post.title})}"></head>
<body>
<div class="app">
    <aside th:replace="~{layout :: sidebar('posts')}"></aside>
    <div class="main">
        <header th:replace="~{layout :: topbar}"></header>

        <main class="content post-page" id="postPage" th:attr="data-post-id=${post.id}">
            <a class="back-link" href="/posts"><i class="fa-solid fa-arrow-left"></i> <th:block th:text="#{post.back}">All posts</th:block></a>

            <div class="notice notice-warn" th:if="${!post.approved}">
                <i class="fa-regular fa-clock"></i>
                <span th:text="#{post.pendingNote}">Waiting for a moderator. Only you and the moderators can see this post for now.</span>
                <span class="notice-actions" th:if="${isModerator}">
                    <button class="btn btn-s btn-good" data-moderate="approve"><i class="fa-solid fa-check"></i> <th:block th:text="#{mod.approve}">Approve</th:block></button>
                    <button class="btn btn-s btn-danger" data-moderate="reject"><i class="fa-solid fa-xmark"></i> <th:block th:text="#{mod.reject}">Reject</th:block></button>
                </span>
            </div>

            <article class="post-article">
                <header class="post-article-head">
                    <div class="eyebrow"><i class="fa-solid fa-tower-broadcast"></i> <th:block th:text="#{posts.eyebrowShort}">Survivor report</th:block></div>
                    <h1 class="post-article-title" th:text="${post.title}">Title</h1>
                    <div class="post-article-meta">
                        <a class="post-author" th:href="@{'/@' + ${post.author.name}}">
                            <img class="avatar avatar-md" th:src="@{/profile/get-avatar(user_id=${post.author.id})}" alt="">
                            <span>
                                <b th:text="${post.author.name}">author</b>
                                <small>
                                    <time th:if="${post.createdAt != null}" th:attr="datetime=${post.createdAt}" th:text="${#temporals.format(post.createdAt, 'd MMMM yyyy, HH:mm')}">date</time>
                                    <th:block th:if="${edited}"> · <th:block th:text="#{post.edited}">edited</th:block></th:block>
                                </small>
                            </span>
                        </a>
                        <div class="post-tools">
                            <button class="icon-btn" id="shareBtn" th:attr="title=#{post.share},aria-label=#{post.share}"><i class="fa-solid fa-link"></i></button>
                            <th:block th:if="${canEdit}">
                                <button class="btn btn-s" id="editBtn"><i class="fa-solid fa-pen"></i> <th:block th:text="#{post.edit}">Edit</th:block></button>
                                <button class="btn btn-s btn-danger-ghost" id="deleteBtn"><i class="fa-regular fa-trash-can"></i> <th:block th:text="#{post.delete}">Delete</th:block></button>
                            </th:block>
                        </div>
                    </div>
                </header>

                <div class="post-gallery" th:if="${!imageIds.isEmpty()}" th:classappend="'n' + ${imageIds.size()}">
                    <button th:each="imgId, st : ${imageIds}" class="post-shot" th:attr="data-full=@{/posts/images/{id}(id=${imgId})},data-image-id=${imgId}">
                        <img th:src="@{/posts/images/{id}(id=${imgId})}" th:alt="${post.title} + ' ' + ${st.count}" loading="lazy">
                    </button>
                </div>

                <div class="post-text" id="postText" th:text="${post.content}">Text</div>
            </article>

            <!-- Data for the edit dialog -->
            <textarea id="postSource" hidden th:text="${post.content}"></textarea>
            <input type="hidden" id="postSourceTitle" th:value="${post.title}">
        </main>
    </div>
</div>

<div th:replace="~{post/parts :: composer}"></div>
<div th:replace="~{post/parts :: confirm}"></div>
<div th:replace="~{post/parts :: lightbox}"></div>
<th:block th:replace="~{layout :: overlays}"></th:block>
<th:block th:replace="~{layout :: scripts}"></th:block>
<script th:src="@{/js/community.js}" src="/js/community.js"></script>
</body>
</html>
