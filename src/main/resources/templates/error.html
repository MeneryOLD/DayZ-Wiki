<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{error.title} + ' · ' + #{site.suffix}">Lost · DayZ Wiki</title>
    <link rel="icon" href="/img/icon.webp" type="image/webp">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <script>try { var t = localStorage.getItem('dz-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body>
<main class="content" style="min-height:100vh;display:grid;place-items:center">
    <section class="hero" style="max-width:760px;width:100%;margin:0">
        <div class="eyebrow"><i class="fa-solid fa-compass"></i> <th:block th:text="#{error.eyebrow}">Signal lost</th:block></div>
        <h1 class="hero-title"><th:block th:text="#{error.title1}">You wandered</th:block> <span th:text="#{error.title2}">off the map</span></h1>
        <p th:text="#{error.text}">This page doesn't exist, or it was moved. Head back to the coast and try again.</p>
        <a class="btn btn-primary" href="/"><i class="fa-solid fa-house"></i> <th:block th:text="#{error.home}">Back to the manual</th:block></a>
        <a class="btn" href="/search" style="margin-left:8px;color:#fff;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15)"><i class="fa-solid fa-magnifying-glass"></i> <th:block th:text="#{error.search}">Search</th:block></a>
    </section>
</main>
</body>
</html>
