<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(#{title.modVideos})}"></head>
<body>
<div class="app">
    <aside th:replace="~{layout :: sidebar('moderation')}"></aside>
    <div class="main">
        <header th:replace="~{layout :: topbar}"></header>

        <main class="content" id="modVideosPage">
            <div class="page-head">
                <div>
                    <div class="eyebrow"><i class="fa-solid fa-shield-halved"></i> <th:block th:text="#{mod.eyebrow}">Moderation</th:block></div>
                    <h1 class="page-title" th:text="#{mod.videosTitle}">Featured videos</h1>
                    <p class="page-sub" th:text="#{mod.videosLead}">The home page plays the active video with the lowest order number. Hidden videos stay here for later.</p>
                </div>
                <div class="page-actions">
                    <button class="btn btn-primary" id="addVideoBtn"><i class="fa-solid fa-plus"></i> <th:block th:text="#{mod.addVideo}">Add video</th:block></button>
                </div>
            </div>
            <nav th:replace="~{post/parts :: modtabs('videos')}"></nav>

            <div class="video-grid" th:if="${!videos.isEmpty()}">
                <article th:each="v, st : ${videos}" class="video-card" th:classappend="${!v.active} ? 'off'"
                         th:attr="data-id=${v.id},data-name=${v.name},data-order=${v.order},data-active=${v.active},data-expiry=${v.expiryDate != null} ? ${#temporals.format(v.expiryDate, 'yyyy-MM-dd')} : ''">
                    <a class="video-thumb" th:href="'https://www.youtube.com/watch?v=' + ${v.id}" target="_blank" rel="noopener">
                        <img th:src="'https://i.ytimg.com/vi/' + ${v.id} + '/mqdefault.jpg'" alt="" loading="lazy">
                        <span class="video-play"><i class="fa-solid fa-play"></i></span>
                        <span class="video-live" th:if="${v.active and st.first}"><i class="fa-solid fa-house"></i> <th:block th:text="#{mod.onHome}">On the home page</th:block></span>
                    </a>
                    <div class="video-body">
                        <div class="video-status">
                            <span class="badge" th:classappend="${v.active} ? 'v-on' : 'v-off'" th:text="${v.active} ? #{mod.active} : #{mod.hidden}">Active</span>
                            <span class="mono small muted">#<th:block th:text="${v.order}">0</th:block></span>
                            <span class="badge v-expired" th:if="${v.expiryDate != null and v.expiryDate.isBefore(#temporals.createNow())}" th:text="#{mod.expired}">Expired</span>
                        </div>
                        <h3 th:text="${v.name}">name</h3>
                        <small class="muted">
                            <th:block th:if="${v.user != null}" th:text="${v.user.name}">author</th:block>
                            <th:block th:if="${v.created != null}"> · <th:block th:text="${#temporals.format(v.created, 'd MMM yyyy')}">date</th:block></th:block>
                            <th:block th:if="${v.expiryDate != null}"> · <th:block th:text="#{mod.until(${#temporals.format(v.expiryDate, 'd MMM yyyy')})}">until</th:block></th:block>
                        </small>
                        <div class="video-actions">
                            <button class="btn btn-s" data-video-edit><i class="fa-solid fa-pen"></i> <th:block th:text="#{post.edit}">Edit</th:block></button>
                            <button class="btn btn-s" data-video-toggle th:attr="data-label-on=#{mod.show},data-label-off=#{mod.hide}">
                                <i th:class="${v.active} ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye'"></i>
                                <th:block th:text="${v.active} ? #{mod.hide} : #{mod.show}">Hide</th:block>
                            </button>
                            <button class="icon-btn danger" data-video-delete th:attr="title=#{post.delete},aria-label=#{post.delete}"><i class="fa-regular fa-trash-can"></i></button>
                        </div>
                    </div>
                </article>
            </div>

            <div class="empty empty-big" th:if="${videos.isEmpty()}">
                <span class="empty-icon"><i class="fa-brands fa-youtube"></i></span>
                <h2 th:text="#{mod.noVideosTitle}">No videos yet</h2>
                <p th:text="#{mod.noVideosText}">Add a YouTube video to feature it on the home page.</p>
            </div>
        </main>
    </div>
</div>

<div class="dialog" id="videoDialog" hidden role="dialog" aria-modal="true" aria-labelledby="videoDialogTitle">
    <form class="dialog-card composer" id="videoForm" novalidate>
        <button type="button" class="icon-btn dialog-close" data-close-dialog th:attr="aria-label=#{drawer.close}"><i class="fa-solid fa-xmark"></i></button>
        <div class="composer-head">
            <div class="eyebrow"><i class="fa-brands fa-youtube"></i> <th:block th:text="#{mod.videosTitle}">Featured videos</th:block></div>
            <h2 id="videoDialogTitle" th:attr="data-new=#{mod.addVideo},data-edit=#{mod.editVideo}" th:text="#{mod.addVideo}">Add video</h2>
        </div>
        <div class="video-preview" id="videoPreview" hidden><img alt=""></div>
        <label class="auth-field"><span th:text="#{mod.videoLink}">YouTube link or video ID</span>
            <span class="auth-input"><i class="fa-brands fa-youtube"></i><input name="link" required autocomplete="off" placeholder="https://www.youtube.com/watch?v=…"></span>
        </label>
        <label class="auth-field"><span th:text="#{mod.videoName}">Title</span>
            <span class="auth-input"><i class="fa-solid fa-heading"></i><input name="name" required maxlength="200" autocomplete="off"></span>
        </label>
        <div class="field-pair">
            <label class="auth-field"><span th:text="#{mod.order}">Order</span>
                <span class="auth-input"><i class="fa-solid fa-arrow-down-1-9"></i><input name="order" type="number" min="0" step="1" value="0"></span>
                <small class="field-hint" th:text="#{mod.orderHint}">Lower shows first</small>
            </label>
            <label class="auth-field"><span th:text="#{mod.expiry}">Show until</span>
                <span class="auth-input"><i class="fa-regular fa-calendar"></i><input name="expiry" type="date" required></span>
            </label>
        </div>
        <label class="switch"><input type="checkbox" name="active" checked><span class="switch-ui"></span><span th:text="#{mod.activeLabel}">Active (can appear on the home page)</span></label>
        <div class="composer-actions">
            <button type="button" class="btn" data-close-dialog th:text="#{compose.cancel}">Cancel</button>
            <button class="btn btn-primary" type="submit"><span th:text="#{mod.save}">Save</span><i class="fa-solid fa-check"></i></button>
        </div>
    </form>
</div>

<div th:replace="~{post/parts :: confirm}"></div>
<th:block th:replace="~{layout :: overlays}"></th:block>
<th:block th:replace="~{layout :: scripts}"></th:block>
<script src="/js/community.js"></script>
</body>
</html>
