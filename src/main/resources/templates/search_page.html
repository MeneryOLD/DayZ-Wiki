<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(#{title.search})}"></head>
<body>
<div class="app">
    <aside th:replace="~{layout :: sidebar('search')}"></aside>
    <div class="main">
        <header th:replace="~{layout :: topbar}"></header>

        <main class="content">
            <div class="page-head">
                <div>
                    <div class="eyebrow"><i class="fa-solid fa-magnifying-glass"></i> <th:block th:text="#{search.eyebrow}">Whole manual</th:block></div>
                    <h1 class="page-title" th:text="#{search.title}">Search</h1>
                    <p class="page-sub" th:text="#{search.lead}">Search names, alternative names and in-game class names across every section.</p>
                </div>
            </div>

            <form class="search-big" id="searchForm" role="search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input class="field" id="q" name="q" autocomplete="off" th:attr="placeholder=#{search.placeholder},aria-label=#{search.title}">
            </form>
            <div class="chips" id="sectionChips" style="margin-bottom:16px"></div>
            <div class="results" id="results">
                <div class="empty"><i class="fa-solid fa-magnifying-glass"></i><th:block th:text="#{search.hint}">Type at least two characters to search.</th:block></div>
            </div>
        </main>
    </div>
</div>

<th:block th:replace="~{layout :: overlays}"></th:block>
<th:block th:replace="~{layout :: scripts}"></th:block>
<script>
    (function () {
        var DZ = window.DZ, esc = DZ.esc;
        var input = document.getElementById('q'), out = document.getElementById('results'), chips = document.getElementById('sectionChips');
        var all = [], filter = '', seq = 0, timer = null;

        function draw() {
            var list = filter ? all.filter(function (i) { return i.source.sourceTable === filter; }) : all;
            if (!list.length) { out.innerHTML = '<div class="empty"><i class="fa-solid fa-circle-question"></i>' + esc(DZ.t('No matches. Try a shorter or different word.')) + '</div>'; return; }
            out.innerHTML = list.map(function (it, i) {
                var t = it.source.sourceTable;
                return '<button class="result" data-i="' + i + '">' + DZ.thumb(it.image, t, 'sm') +
                    '<span style="min-width:0"><div class="result-name">' + esc(it.englishName) + '</div>' +
                    '<div class="result-desc">' + esc(it.description || '') + '</div></span>' +
                    '<span class="badge">' + esc(DZ.titleFor(t)) + ' · ' + esc(DZ.t(it.section)) + '</span></button>';
            }).join('');
            out.querySelectorAll('.result').forEach(function (b) {
                b.addEventListener('click', function () { DZ.openItemUrl(list[+b.dataset.i].url); });
            });
        }

        function drawChips() {
            var counts = {};
            all.forEach(function (i) { counts[i.source.sourceTable] = (counts[i.source.sourceTable] || 0) + 1; });
            var keys = Object.keys(counts);
            if (filter && !counts[filter]) filter = '';
            chips.innerHTML = all.length ? ['<button class="chip' + (!filter ? ' active' : '') + '" data-f="">' + esc(DZ.t('All')) + ' <span class="n">' + all.length + '</span></button>']
                .concat(keys.map(function (k) {
                    return '<button class="chip' + (filter === k ? ' active' : '') + '" data-f="' + k + '">' + esc(DZ.titleFor(k)) + ' <span class="n">' + counts[k] + '</span></button>';
                })).join('') : '';
            chips.querySelectorAll('.chip').forEach(function (c) {
                c.addEventListener('click', function () { filter = c.dataset.f; drawChips(); draw(); });
            });
        }

        function run() {
            var q = input.value.trim();
            history.replaceState(null, '', '/search' + (q ? '?q=' + encodeURIComponent(q) : ''));
            if (q.length < 2) { all = []; drawChips(); out.innerHTML = '<div class="empty"><i class="fa-solid fa-magnifying-glass"></i>' + esc(DZ.t('Type at least two characters to search.')) + '</div>'; return; }
            var my = ++seq;
            DZ.searchApi(q, 200).then(function (data) {
                if (my !== seq) return;
                all = data.items;
                drawChips(); draw();
            }).catch(function () { out.innerHTML = '<div class="empty">' + esc(DZ.t('Search is unavailable right now.')) + '</div>'; });
        }

        document.getElementById('searchForm').addEventListener('submit', function (e) { e.preventDefault(); run(); });
        input.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(run, 180); });
        input.value = new URLSearchParams(location.search).get('q') || '';
        input.focus();
        run();
    })();
</script>
</body>
</html>
