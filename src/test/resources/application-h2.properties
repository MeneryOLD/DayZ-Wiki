# Test/demo profile: in-memory H2 instead of MySQL. Used by the page tests and for local previews:
#   ./mvnw spring-boot:run -Dspring-boot.run.useTestClasspath=true -Dspring-boot.run.profiles=h2,demo
spring.application.name=DayZWiki
dayzwiki.url=http://localhost:8080
spring.datasource.url=jdbc:h2:mem:dayzwiki;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.mail.host=localhost
spring.mail.port=2525
app.jwt-secret=/eONWEgcE7HLjgJaNdMJowJmafx42CEtCtqCUVfWYQJubXdkNZK4Ack2n/3QBQIIIlTXikirs71NBAlO5LmciA==
app.jwt-expiration-milliseconds=86400000
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
